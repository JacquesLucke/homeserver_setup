- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true

# Debian's default 50unattended-upgrades config only allows packages from Debian's
# security and stable point release suites. Packages from the Raspberry Pi
# repository (kernel, firmware, ...) are not upgraded automatically.
- name: Enable daily package list updates and unattended upgrades
  ansible.builtin.copy:
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"

- name: Start unattended-upgrades and enable it on boot
  ansible.builtin.service:
    name: unattended-upgrades
    state: started
    enabled: true
