ansible_become_password: "{{ vault_become_password }}"

# The Beszel hub runs on polaris and is reached over tailscale.
beszel_hub_url: http://polaris:8090

landing_port: 80

# Home Assistant uses the host network, so this can't be remapped.
homeassistant_port: 8123

# Port that restic clients can connect to for backups.
rest_server_port: 8000

# Accounts that can back up to the rest-server. Each one only has access to its own repositories.
rest_server_accounts:
  - { name: polaris, password: "{{ vault_sirius_rest_server_polaris_login }}" }

# Services linked from the landing page.
landing_services:
  - { name: Home Assistant, port: "{{ homeassistant_port }}" }
