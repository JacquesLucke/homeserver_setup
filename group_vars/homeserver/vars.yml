ansible_become_password: "{{ vault_become_password }}"

disk_jacques_data_1:
  name: jacques-data-1
  mount: /mnt/jacques-data-1
  disk_id: ata-WDC_WD60EFPX-68C5ZN0_WD-WX82D562XC83
  fs_uuid: 9a32233e-9e0a-4f31-b98b-89769a35f29d
  fs_type: ext4

disk_jacques_parity_1:
  name: jacques-parity-1
  mount: /mnt/jacques-parity-1
  disk_id: ata-ST6000VN006-2ZM186_C5Z04GG1
  fs_uuid: c5c6178a-0e69-4280-b8d6-8f6cb553629c
  fs_type: ext4

disk_system:
  name: system-ssd
  disk_id: ata-SSD_512GB_2609130001613

# Disks that are merged together by mergerfs.
mergerfs_disks: "{{ [disk_jacques_data_1] }}"

# Disks used by snapraid for data.
snapraid_data_disks: "{{ [disk_jacques_data_1] }}"

# Disks used by snapraid for parity. The order is important.
snapraid_parity_disks: "{{ [disk_jacques_parity_1] }}"

# All disks mounted under /mnt, without the mergerfs pool.
mounted_disks: "{{ [disk_jacques_data_1, disk_jacques_parity_1] }}"

landing_port: 80
copyparty_port: 3923
seerr_port: 5055
beszel_port: 8090
audiobookshelf_port: 13378

# If changed, the port also needs to be updated in Seerr's config file.
jellyfin_port: 8096

# Home Assistant uses the host network, so this can't be remapped.
homeassistant_port: 8123

# Cockpit's default port, which is set by its systemd socket.
cockpit_port: 9090

# Services linked from the landing page.
landing_services:
  - { name: Jellyfin, port: "{{ jellyfin_port }}" }
  - { name: Seerr, port: "{{ seerr_port }}" }
  - { name: Audiobookshelf, port: "{{ audiobookshelf_port }}" }
  - { name: Copyparty, port: "{{ copyparty_port }}" }
  - { name: Home Assistant, port: "{{ homeassistant_port }}" }
  - { name: Beszel, port: "{{ beszel_port }}" }
  - { name: Cockpit, port: "{{ cockpit_port }}" }

ente_backup_time: 03:03:00
jellyfin_backup_time: 03:20:00
snapraid_sync_time: 03:35:00
