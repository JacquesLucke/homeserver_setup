[project]
name = "server-setup"
version = "0.1.0"
# Python 3.15 is not yet supported by ansible.
requires-python = ">=3.14,<3.15"
dependencies = [
    "ansible>=14.6.0",
    "ansible-lint>=26.11.0",
    "bcrypt>=5.0.0",
    "passlib>=1.9.5",
    "pydantic>=2.12",
    "pyright>=1.1.414",
    "ruff>=0.17.6",
    "typer>=0.29.3",
]

# Checks the Python scripts that are deployed to the servers.
[tool.pyright]
include = ["polaris", "sirius", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.ruff]
line-length = 100
