- name: Install mergerfs
  ansible.builtin.apt:
    name: mergerfs
    state: present
    update_cache: true

# No nofail: if a disk is missing, boot stops in emergency mode instead of
# starting the services on an empty mountpoint. Recover through a KVM.
- name: Mount data disks
  ansible.posix.mount:
    path: "{{ item.mount }}"
    src: "UUID={{ item.fs_uuid }}"
    fstype: "{{ item.fs_type }}"
    opts: defaults
    state: mounted
  loop: "{{ mergerfs_disks }}"

- name: Make data disk roots accessible
  ansible.builtin.file:
    path: "{{ item.mount }}"
    state: directory
    owner: jacques
    group: jacques
    mode: "0755"
  loop: "{{ mergerfs_disks }}"

- name: Mount mergerfs pool
  ansible.posix.mount:
    path: /mnt/storage
    src: "{{ storage_branches | join(':') }}"
    fstype: fuse.mergerfs
    opts: "cache.files=off,category.create=mspmfs,func.getattr=newest,dropcacheonclose=false,allow_other,fsname=mergerfs,{{ storage_requires }}"
    state: mounted
  vars:
    storage_branches: "{{ mergerfs_disks | map(attribute='mount') | list }}"
    # Only mount the pool once all disks are mounted.
    storage_requires: "{{ storage_branches | map('regex_replace', '^', 'x-systemd.requires-mounts-for=') | join(',') }}"
