- name: Install cockpit
  ansible.builtin.apt:
    name:
      - cockpit
      - cockpit-storaged
      # Records metrics, so cockpit can show the history of e.g. disk I/O.
      - pcp
      - python3-pcp
    state: present
    # Avoid installing NetworkManager which would conflict with the network role.
    install_recommends: false
    update_cache: true

- name: Configure cockpit
  ansible.builtin.template:
    src: cockpit.conf.j2
    dest: /etc/cockpit/cockpit.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart cockpit

- name: Enable cockpit and metrics recording
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - cockpit.socket
    - pmcd.service
    - pmlogger.service
