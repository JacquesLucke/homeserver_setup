wireplumber.profiles = {
  main = {
    # Don't remember changes made at runtime (e.g. with wpctl), so that the
    # configuration here always applies after a restart.
    hooks.device.profile.state = disabled
    hooks.device.routes.state = disabled
    hooks.default-nodes.state = disabled
    hooks.stream.state = disabled
  }
}

monitor.alsa.rules = [
  {
    # Prefer the onboard sound card as default output over USB ones.
    # Use "~alsa_output.usb-.*" to prefer a USB sound card instead.
    matches = [ { node.name = "~alsa_output.pci-.*" } ]
    actions = { update-props = { priority.session = 2000 } }
  }
]

wireplumber.settings = {
  # The volume is controlled by the devices that play audio on the server.
  device.routes.default-sink-volume = 1.0
}
