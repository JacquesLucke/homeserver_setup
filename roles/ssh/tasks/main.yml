- name: Harden SSH
  ansible.builtin.copy:
    content: |
      PermitRootLogin no
      # Only allow logging in with SSH keys.
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    # The 00 prefix makes it so that this overwrites other configs like cloud-init's.
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: sshd -t -f %s
  notify: Reload SSH
