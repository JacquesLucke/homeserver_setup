- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true

- name: Start Docker and enable it on boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Configure Docker logging
  ansible.builtin.copy:
    content: |
      {
        "log-driver": "local",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    validate: dockerd --validate --config-file %s
  notify: Restart Docker

- name: Flush handlers so Docker uses the new config
  ansible.builtin.meta: flush_handlers
