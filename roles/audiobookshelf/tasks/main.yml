# Audiobookshelf runs as jacques so it can write to the audiobooks folder,
# which is owned by jacques.
- name: Look up the jacques user
  ansible.builtin.getent:
    database: passwd
    key: jacques

- name: Create audiobookshelf data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: jacques
    group: jacques
    mode: "0750"
  loop:
    - /srv/audiobookshelf
    - /srv/audiobookshelf/config
    - /srv/audiobookshelf/metadata

- name: Copy audiobookshelf compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /srv/audiobookshelf/compose.yml
    owner: root
    group: root
    mode: "0644"

- name: Start audiobookshelf
  community.docker.docker_compose_v2:
    project_src: /srv/audiobookshelf
    state: present
