- name: Install SnapRAID
  ansible.builtin.apt:
    name: snapraid
    state: present
    update_cache: true

- name: Mount parity disks
  ansible.posix.mount:
    path: "/mnt/{{ item.name }}"
    src: "UUID={{ item.fs_uuid }}"
    fstype: "{{ item.fs_type }}"
    # nofail is fine because the SnapRAID service checks availability.
    opts: defaults,nofail
    state: mounted
  loop: "{{ snapraid_parity_disks }}"

- name: Create SnapRAID content directory
  ansible.builtin.file:
    path: /var/lib/snapraid
    state: directory
    mode: "0755"

- name: Configure SnapRAID
  ansible.builtin.template:
    src: snapraid.conf.j2
    dest: /etc/snapraid.conf
    owner: root
    group: root
    mode: "0644"

- name: Install SnapRAID maintenance script
  ansible.builtin.copy:
    src: snapraid-maintenance
    dest: /usr/local/bin/snapraid-maintenance
    owner: root
    group: root
    mode: "0755"

- name: Install SnapRAID maintenance service
  ansible.builtin.template:
    src: snapraid-maintenance.service.j2
    dest: /etc/systemd/system/snapraid-maintenance.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install SnapRAID maintenance timer
  ansible.builtin.copy:
    src: snapraid-maintenance.timer
    dest: /etc/systemd/system/snapraid-maintenance.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers so systemd knows the new units
  ansible.builtin.meta: flush_handlers

- name: Enable SnapRAID maintenance timer
  ansible.builtin.systemd_service:
    name: snapraid-maintenance.timer
    state: started
    enabled: true
