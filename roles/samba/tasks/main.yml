- name: Install Samba
  ansible.builtin.apt:
    name: samba
    state: present
    update_cache: true

- name: Configure Samba
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
    validate: testparm -s %s
  notify: Restart Samba

- name: Start Samba and enable it on boot
  ansible.builtin.service:
    name: smbd
    state: started
    enabled: true

- name: List Samba users
  ansible.builtin.command: pdbedit -L
  register: samba_users
  changed_when: false
  check_mode: false

- name: Add jacques as Samba user
  ansible.builtin.command: smbpasswd -s -a jacques
  args:
    stdin: "{{ vault_samba_password }}\n{{ vault_samba_password }}"
  when: samba_users.stdout_lines | select('match', '^jacques:') | list | length == 0
  changed_when: true
  no_log: true
