- name: Create seerr data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    # Seerr runs as the node user (UID 1000) inside the container.
    owner: "1000"
    group: "1000"
    mode: "0750"
  loop:
    - /srv/seerr
    - /srv/seerr/config

- name: Copy seerr compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /srv/seerr/compose.yml
    owner: root
    group: root
    mode: "0644"

- name: Start seerr
  community.docker.docker_compose_v2:
    project_src: /srv/seerr
    state: present
