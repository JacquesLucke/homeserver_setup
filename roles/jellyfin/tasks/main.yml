# Jellyfin runs as jacques so it can store metadata next to the media files,
# which are owned by jacques.
- name: Look up the jacques user
  ansible.builtin.getent:
    database: passwd
    key: jacques

- name: Look up the render group for GPU access
  ansible.builtin.getent:
    database: group
    key: render

- name: Create jellyfin data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: jacques
    group: jacques
    mode: "0750"
  loop:
    - /srv/jellyfin
    - /srv/jellyfin/config
    - /srv/jellyfin/cache

- name: Copy jellyfin compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /srv/jellyfin/compose.yml
    owner: root
    group: root
    mode: "0644"

- name: Start jellyfin
  community.docker.docker_compose_v2:
    project_src: /srv/jellyfin
    state: present
