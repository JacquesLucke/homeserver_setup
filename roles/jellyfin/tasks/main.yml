# Jellyfin runs as jacques so it can store metadata next to the media files,
# which are owned by jacques.
- name: Look up the jacques user
  ansible.builtin.getent:
    database: passwd
    key: jacques

- name: Look up the render group for GPU access
  ansible.builtin.getent:
    database: group
    key: render

- name: Create jellyfin data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: jacques
    group: jacques
    mode: "0750"
  loop:
    - /srv/jellyfin
    - /srv/jellyfin/config
    - /srv/jellyfin/cache
    - /mnt/storage/app_backup/jellyfin

- name: Copy jellyfin compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /srv/jellyfin/compose.yml
    owner: root
    group: root
    mode: "0644"

- name: Start jellyfin
  community.docker.docker_compose_v2:
    project_src: /srv/jellyfin
    state: present

- name: Install jellyfin backup script
  ansible.builtin.template:
    src: jellyfin-backup.j2
    dest: /usr/local/bin/jellyfin-backup
    owner: root
    group: root
    # Contains the API key.
    mode: "0700"

- name: Install jellyfin backup service
  ansible.builtin.copy:
    src: jellyfin-backup.service
    dest: /etc/systemd/system/jellyfin-backup.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install jellyfin backup timer
  ansible.builtin.template:
    src: jellyfin-backup.timer.j2
    dest: /etc/systemd/system/jellyfin-backup.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers so systemd knows the new units
  ansible.builtin.meta: flush_handlers

- name: Enable jellyfin backup timer
  ansible.builtin.systemd_service:
    name: jellyfin-backup.timer
    state: started
    enabled: true
