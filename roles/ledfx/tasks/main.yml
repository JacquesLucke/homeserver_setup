- name: Create ledfx data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0750"
  loop:
    - /srv/ledfx
    - /srv/ledfx/config
    - /srv/ledfx/pulse

- name: Copy ledfx compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /srv/ledfx/compose.yml
    owner: root
    group: root
    mode: "0644"

- name: Start ledfx
  community.docker.docker_compose_v2:
    project_src: /srv/ledfx
    state: present
