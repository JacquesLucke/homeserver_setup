- name: Create ledfx data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0750"
  loop:
    - /srv/ledfx
    - /srv/ledfx/config
    - /srv/ledfx/pulse

- name: Copy ledfx compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /srv/ledfx/compose.yml
    owner: root
    group: root
    mode: "0644"
  notify: Restart ledfx

# Pull image already so it doesn't need to be done on first start.
- name: Pull ledfx image
  community.docker.docker_compose_v2_pull:
    project_src: /srv/ledfx

- name: Install ledfx service
  ansible.builtin.template:
    src: ledfx.service.j2
    dest: /etc/systemd/system/ledfx.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart ledfx
