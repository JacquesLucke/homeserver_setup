- name: Set up homeserver
  hosts: homeserver
  become: true
  tasks:
    - name: Check Connection
      ansible.builtin.ping:

    - name: Install htop
      ansible.builtin.package:
        name: htop
        state: present

    - name: Mount storage drive
      ansible.posix.mount:
        path: /mnt/storage
        src: UUID=14d156db-35eb-4ee8-a475-06eea9c7571a
        fstype: ext4
        opts: defaults,nofail
        state: mounted

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true
    - name: Start Docker and enable it on boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create jellyfin group
      ansible.builtin.group:
        name: jellyfin
        system: true
    - name: Create jellyfin user
      ansible.builtin.user:
        name: jellyfin
        group: jellyfin
        system: true
        create_home: false
        shell: /usr/sbin/nologin
      register: jellyfin_user

    - name: Create jellyfin data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: jellyfin
        group: jellyfin
        mode: "0750"
      loop:
        - /srv/jellyfin
        - /srv/jellyfin/config
        - /srv/jellyfin/cache

    - name: Copy jellyfin compose file
      ansible.builtin.template:
        src: jellyfin/compose.yml.j2
        dest: /srv/jellyfin/compose.yml
        owner: root
        group: root
        mode: "0644"

    - name: Start jellyfin
      community.docker.docker_compose_v2:
        project_src: /srv/jellyfin
        state: present
