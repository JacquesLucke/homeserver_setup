- name: Set up homeserver
  hosts: homeserver
  become: true
  roles:
    - updates
    - tools
    - ssh
    - recovery
    - notify
    - storage
    - snapraid
    - docker
    - tailscale
    - jellyfin
    - audiobookshelf
    - copyparty
    - homeassistant
    - samba
    - beszel
    - ente_backup
