# msmtp-mta provides the sendmail command, sending through an SMTP server.
- name: Install msmtp
  ansible.builtin.apt:
    name:
      - msmtp
      - msmtp-mta
      # Provides the mail command, which e.g. smartd uses.
      - bsd-mailx
    state: present
    update_cache: true

- name: Configure msmtp
  ansible.builtin.template:
    src: msmtprc.j2
    dest: /etc/msmtprc
    owner: root
    group: root
    # Contains the SMTP password.
    mode: "0600"

# Other programs like smartd send mail to root. The default entry covers all
# local recipients.
- name: Forward mail for local users to the notification address
  ansible.builtin.copy:
    content: |
      default: {{ vault_notify_email }}
    dest: /etc/aliases
    owner: root
    group: root
    mode: "0644"

- name: Install failure notification script
  ansible.builtin.template:
    src: notify-failure.j2
    dest: /usr/local/bin/notify-failure
    owner: root
    group: root
    mode: "0755"

# Other units use it with OnFailure=notify-failure@%n.service.
- name: Install failure notification service
  ansible.builtin.copy:
    src: notify-failure@.service
    dest: /etc/systemd/system/notify-failure@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

# Regularly pings healthchecks.io, which sends an email when the pings stop,
# e.g. because the server is down.
- name: Install curl
  ansible.builtin.apt:
    name: curl
    state: present
    update_cache: true

# The ping URL is secret, so it's kept out of the world-readable unit file and
# the process list.
- name: Configure heartbeat ping URL
  ansible.builtin.copy:
    content: |
      url = {{ vault_healthchecks_ping_url | to_json }}
    dest: /etc/heartbeat-curl.conf
    owner: root
    group: root
    mode: "0600"

- name: Install heartbeat service
  ansible.builtin.copy:
    src: heartbeat.service
    dest: /etc/systemd/system/heartbeat.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install heartbeat timer
  ansible.builtin.copy:
    src: heartbeat.timer
    dest: /etc/systemd/system/heartbeat.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers so systemd knows the new units
  ansible.builtin.meta: flush_handlers

- name: Enable heartbeat timer
  ansible.builtin.systemd_service:
    name: heartbeat.timer
    state: started
    enabled: true
