- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# Only restarts ledfx if it is running, which the systemd module can't do.
- name: Restart ledfx  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl try-restart ledfx.service
  changed_when: true
