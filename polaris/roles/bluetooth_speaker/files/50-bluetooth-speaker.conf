wireplumber.profiles = {
  main = {
    # Disable checking if someone is logged in locally before allowing bluetooth connections.
    monitor.bluez.seat-monitoring = disabled
  }
}

monitor.bluez.properties = {
  # Act as a bluetooth speaker.
  bluez5.roles = [ a2dp_sink ]
  # Only offer the basic codec that every device supports. With the others (aptX HD
  # and Opus), there were issues where I couldn't play from my phone.
  bluez5.codecs = [ sbc sbc_xq ]
}
