- name: Set up polaris
  hosts: polaris
  become: true
  pre_tasks:
    - name: Validate vault data against vault_schema
      ansible.utils.validate:
        data: "{{ lookup('ansible.builtin.unvault', inventory_dir ~ '/host_vars/' ~ inventory_hostname ~ '/vault.yml') | from_yaml }}"
        criteria: "{{ vault_schema }}"
        engine: ansible.utils.jsonschema
    - name: Validate shared vault data against shared_vault_schema
      ansible.utils.validate:
        data: "{{ lookup('ansible.builtin.unvault', inventory_dir ~ '/group_vars/all/vault.yml') | from_yaml }}"
        criteria: "{{ shared_vault_schema }}"
        engine: ansible.utils.jsonschema
  roles:
    - updates
    - tools
    - ssh
    - network
    - recovery
    - notify
    - storage
    - snapraid
    - docker
    - tailscale
    - jellyfin
    - seerr
    - audiobookshelf
    - paperless
    - copyparty
    - control_panel
    - zigbee2mqtt
    - homeassistant
    - audio
    - bluetooth_speaker
    - ledfx
    - iperf3
    - samba
    - beszel
    - landing
    - ente_backup
    - disk_activity
    - cockpit
    - spindown
